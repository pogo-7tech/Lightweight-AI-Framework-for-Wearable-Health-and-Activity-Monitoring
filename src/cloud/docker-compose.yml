version: "3.9"

services:
  # ─── Eclipse Mosquitto MQTT Broker ─────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: wearable-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"   # WebSocket (optional, for browser clients)
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  # ─── InfluxDB 2.x Time-Series Database ─────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: wearable-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE:        setup
      DOCKER_INFLUXDB_INIT_USERNAME:    admin
      DOCKER_INFLUXDB_INIT_PASSWORD:    wearable2026
      DOCKER_INFLUXDB_INIT_ORG:         wearable_lab
      DOCKER_INFLUXDB_INIT_BUCKET:      wearable_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: wearable-dev-token-2026
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  # ─── Grafana (optional real-time dashboards) ────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: wearable-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: wearable2026
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  grafana_data:
